name: Pulse

options:
  bundleIdPrefix: uz.pulse
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "2660"

settings:
  base:
    DEVELOPMENT_TEAM: T9VBHNUC76
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULE_VERIFIER: NO
    # Warnings we actually want to hear about in a money app.
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  PulseKit:
    path: Packages/PulseKit

targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - path: Pulse
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: PulseKit
        product: PulseCore
      - package: PulseKit
        product: PulseParse
      - package: PulseKit
        product: PulseUI
      - package: PulseKit
        product: PulseAI
    info:
      path: Pulse/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # Speech + microphone are required for natural-language expense entry.
        NSMicrophoneUsageDescription: >-
          Pulse uses the microphone so you can add expenses by speaking, in Uzbek, Russian, or English.
        NSSpeechRecognitionUsageDescription: >-
          Pulse turns your speech into text on this device so you can log spending by talking instead of typing.
        # Uzbek (Latin + Cyrillic), Russian, English.
        CFBundleLocalizations:
          - en
          - ru
          - uz
    entitlements:
      path: Pulse/Pulse.entitlements
      properties:
        # Paid-team entitlement: raises the jetsam ceiling so the on-device model has headroom.
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.pulse.app
        PRODUCT_NAME: Pulse
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1"

  PulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PulseTests
    dependencies:
      - target: Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.pulse.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pulse:
    build:
      targets:
        Pulse: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PulseTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
